<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bellwood FOE 1859 Aerie - Volunteer Portal</title>
    <style>
        :root {
            --bg: #0b0f14;
            --surface: rgba(255,255,255,0.06);
            --surface-2: rgba(255,255,255,0.10);
            --border: rgba(255,255,255,0.14);
            --text: rgba(255,255,255,0.92);
            --muted: rgba(255,255,255,0.62);
            --accent: #e11d48;
            --gold: #fbbf24;
            --green: #22c55e;
            --pattern-color: #60a5fa;
            --radius-lg: 20px;
            --radius-md: 14px;
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.55);
            --shadow-md: 0 10px 30px rgba(0,0,0,0.35);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
            background:
                radial-gradient(1000px 700px at 20% 20%, rgba(225, 29, 72, 0.14), transparent 55%),
                radial-gradient(900px 650px at 80% 30%, rgba(96, 165, 250, 0.12), transparent 55%),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            font-size: 18px;
        }

        .portal-container {
            text-align: center;
            max-width: 900px;
            padding: clamp(20px, 5vw, 40px);
        }

        .lodge-title {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: clamp(2.5rem, 6vw, 5rem);
            color: var(--pattern-color);
            letter-spacing: 2px;
            text-shadow: 0 0 30px rgba(96, 165, 250, 0.3);
            margin-bottom: 0.3rem;
        }

        .lodge-subtitle {
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            color: var(--gold);
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 3rem;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.25);
        }

        .portal-label {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            color: var(--muted);
            margin-bottom: 2.5rem;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .button-row {
            display: flex;
            gap: clamp(16px, 3vw, 30px);
            justify-content: center;
            flex-wrap: wrap;
        }

        .portal-btn {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: clamp(200px, 28vw, 260px);
            height: clamp(160px, 28vw, 200px);
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: var(--text);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        .portal-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius-lg);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .portal-btn.bingo::before {
            background: radial-gradient(circle at center, rgba(225, 29, 72, 0.15), transparent 70%);
        }

        .portal-btn.trivia-jeopardy::before {
            background: radial-gradient(circle at center, rgba(251, 191, 36, 0.15), transparent 70%);
        }

        .portal-btn.trivia-classic::before {
            background: radial-gradient(circle at center, rgba(34, 197, 94, 0.15), transparent 70%);
        }

        .portal-btn:hover {
            transform: translateY(-6px) scale(1.03);
            border-color: rgba(255,255,255,0.3);
            box-shadow: var(--shadow-lg);
        }

        .portal-btn:hover::before {
            opacity: 1;
        }

        .portal-btn:active {
            transform: translateY(-2px) scale(1.01);
        }

        .btn-icon {
            font-size: 3.5rem;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }

        .portal-btn.bingo .btn-icon {
            color: var(--accent);
            text-shadow: 0 0 25px rgba(225, 29, 72, 0.5);
        }

        .portal-btn.trivia-jeopardy .btn-icon {
            color: var(--gold);
            text-shadow: 0 0 25px rgba(251, 191, 36, 0.5);
        }

        .portal-btn.trivia-classic .btn-icon {
            color: var(--green);
            text-shadow: 0 0 25px rgba(34, 197, 94, 0.5);
        }

        .btn-label {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 1.4rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
            line-height: 1.2;
            text-align: center;
            padding: 0 8px;
        }

        .portal-btn.bingo .btn-label {
            color: var(--accent);
        }

        .portal-btn.trivia-jeopardy .btn-label {
            color: var(--gold);
        }

        .portal-btn.trivia-classic .btn-label {
            color: var(--green);
        }

        .btn-desc {
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 6px;
            position: relative;
            z-index: 1;
        }

        .created-by {
            margin-top: 3rem;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.35);
            text-align: center;
            line-height: 1.6;
        }

        .created-by a {
            color: rgba(96, 165, 250, 0.5);
            text-decoration: none;
        }

        .created-by a:hover {
            color: rgba(96, 165, 250, 0.8);
        }

        @media (max-width: 700px) {
            .button-row {
                flex-direction: column;
                align-items: center;
                gap: 16px;
            }
            .portal-btn {
                width: min(260px, 85vw);
                height: 160px;
            }
            .lodge-subtitle {
                margin-bottom: 2rem;
            }
            .portal-label {
                margin-bottom: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .portal-btn {
                width: min(240px, 90vw);
                height: 150px;
            }
            .btn-icon {
                font-size: 2.8rem;
                margin-bottom: 8px;
            }
            .btn-label {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="portal-container">
        <h1 class="lodge-title">BELLWOOD FOE 1859</h1>
        <div class="lodge-subtitle">Aerie</div>
        <div class="portal-label">Volunteer Portal</div>

        <div class="button-row">
            <a href="bingo.html" class="portal-btn bingo">
                <div class="btn-icon">&#127183;</div>
                <div class="btn-label">Bingo Caller</div>
                <div class="btn-desc">Run a bingo game</div>
            </a>

            <a href="trivia.html" class="portal-btn trivia-jeopardy">
                <div class="btn-icon">&#129504;</div>
                <div class="btn-label">Trivia Jeopardy Style</div>
                <div class="btn-desc">Answer in the form of a question</div>
            </a>

            <a href="trivia-classic.html" class="portal-btn trivia-classic">
                <div class="btn-icon">&#10067;</div>
                <div class="btn-label">Trivia Classic</div>
                <div class="btn-desc">Classic Q&amp;A trivia night</div>
            </a>
        </div>

        <div class="created-by">
            Volunteer Tools &mdash; Bellwood FOE 1859 Aerie<br>
            Created by <a href="https://github.com/Jake7337" target="_blank">Jake7337</a>
        </div>
    </div>
</body>
</html>
