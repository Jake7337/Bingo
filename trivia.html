<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bellwood FOE 1859 Aerie - Trivia Night</title>
    <style>
        :root {
            --bg: #0b0f14;
            --surface: rgba(255,255,255,0.06);
            --surface-2: rgba(255,255,255,0.10);
            --border: rgba(255,255,255,0.14);
            --text: rgba(255,255,255,0.92);
            --muted: rgba(255,255,255,0.62);
            --accent: #e11d48;
            --gold: #fbbf24;
            --pattern-color: #60a5fa;
            --cell-off: rgba(255,255,255,0.08);
            --radius-lg: 20px;
            --radius-md: 14px;
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.55);
            --shadow-md: 0 10px 30px rgba(0,0,0,0.35);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
            background:
                radial-gradient(1000px 700px at 20% 20%, rgba(225, 29, 72, 0.14), transparent 55%),
                radial-gradient(900px 650px at 80% 30%, rgba(96, 165, 250, 0.12), transparent 55%),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
            font-size: 18px;
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        /* ── Shared ── */
        .hidden { display: none !important; }

        .impact { font-family: 'Impact', 'Arial Black', sans-serif; }

        button, input, select, textarea {
            font-family: inherit;
            font-size: inherit;
            color: var(--text);
        }

        /* ── Back Link ── */
        .back-link {
            position: fixed;
            top: 16px;
            left: 20px;
            z-index: 100;
            color: var(--muted);
            text-decoration: none;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--text); }

        /* ══════════════════════════════════
           SCREEN 1 — SETUP
        ══════════════════════════════════ */
        #setup-screen {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 30px 40px;
        }

        .setup-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .setup-header h1 {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: var(--gold);
            letter-spacing: 2px;
            text-shadow: 0 0 25px rgba(251, 191, 36, 0.3);
        }

        .setup-header p {
            color: var(--muted);
            margin-top: 8px;
            font-size: 1.1rem;
        }

        .setup-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 28px;
            margin-bottom: 24px;
        }

        .setup-section h2 {
            font-size: 1.2rem;
            color: var(--gold);
            margin-bottom: 16px;
            font-weight: 700;
        }

        .setup-row {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        .setup-row label {
            font-size: 1rem;
            color: var(--muted);
            min-width: 160px;
        }

        .setup-row input[type="number"],
        .setup-row input[type="text"],
        .setup-row select {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 1rem;
            color: var(--text);
            width: 120px;
            outline: none;
            transition: border-color 0.2s;
        }

        .setup-row input:focus,
        .setup-row select:focus {
            border-color: var(--gold);
        }

        /* Teams */
        .team-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .team-entry {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .team-entry input {
            flex: 1;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 1rem;
            outline: none;
            max-width: 400px;
        }

        .team-entry input:focus {
            border-color: var(--gold);
        }

        .btn-small {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            color: var(--muted);
        }

        .btn-small:hover {
            background: var(--surface);
            border-color: var(--accent);
            color: var(--text);
        }

        .btn-small.remove {
            color: var(--accent);
            padding: 8px 12px;
        }

        .btn-add-team {
            align-self: flex-start;
            margin-top: 4px;
        }

        /* Timer toggle */
        .toggle-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toggle {
            width: 50px;
            height: 28px;
            background: var(--cell-off);
            border-radius: 14px;
            cursor: pointer;
            position: relative;
            transition: background 0.3s;
            border: none;
        }

        .toggle.on {
            background: var(--accent);
        }

        .toggle::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle.on::after {
            transform: translateX(22px);
        }

        /* ── Start Game Button ── */
        .btn-start-game {
            display: block;
            margin: 10px auto 0;
            padding: 16px 60px;
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(225, 29, 72, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-start-game:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(225, 29, 72, 0.8);
        }

        /* ══════════════════════════════════
           SCREEN 2 — QUESTION ENTRY
        ══════════════════════════════════ */
        #question-screen {
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 30px 40px;
        }

        .q-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .q-header h1 {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            color: var(--gold);
        }

        .q-round-tabs {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .round-tab {
            padding: 10px 24px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s;
            color: var(--muted);
        }

        .round-tab:hover { border-color: var(--gold); color: var(--text); }

        .round-tab.active {
            background: rgba(251, 191, 36, 0.15);
            border-color: var(--gold);
            color: var(--gold);
        }

        .category-block {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 20px;
        }

        .category-block h3 {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .category-block h3 input {
            flex: 1;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--gold);
            outline: none;
        }

        .category-block h3 input:focus { border-color: var(--gold); }
        .category-block h3 input::placeholder { color: rgba(251,191,36,0.4); }

        .question-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: flex-start;
        }

        .question-row .q-num {
            min-width: 28px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-weight: 700;
            font-size: 0.9rem;
        }

        .question-row input {
            flex: 1;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.95rem;
            outline: none;
        }

        .question-row input:focus { border-color: var(--pattern-color); }

        .question-row input.answer-input {
            max-width: 300px;
        }

        .question-row input.answer-input:focus { border-color: var(--gold); }

        .btn-add-question {
            margin-top: 6px;
        }

        .q-nav-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 30px;
        }

        .btn-nav {
            padding: 14px 40px;
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 1.3rem;
            letter-spacing: 1px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-nav:hover { transform: scale(1.04); }

        .btn-nav.primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 0 20px rgba(225, 29, 72, 0.4);
        }

        .btn-nav.secondary {
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border);
        }

        /* ══════════════════════════════════
           SCREEN 3 — GAME BOARD
        ══════════════════════════════════ */
        #game-screen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }

        /* Top bar */
        .game-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            margin-bottom: 10px;
        }

        .game-title {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 1.4rem;
            color: var(--gold);
            letter-spacing: 2px;
        }

        .round-indicator {
            font-size: 1.1rem;
            color: var(--pattern-color);
            font-weight: 700;
        }

        .game-controls {
            display: flex;
            gap: 10px;
        }

        .btn-game {
            padding: 8px 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
            color: var(--muted);
        }

        .btn-game:hover { border-color: var(--gold); color: var(--text); }

        .btn-game.active-btn {
            background: rgba(225, 29, 72, 0.15);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Category board */
        .board-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
        }

        .category-grid {
            display: grid;
            gap: 10px;
            flex: 1;
            min-height: 0;
        }

        .cat-column {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .cat-header {
            background: rgba(251, 191, 36, 0.12);
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: var(--radius-md);
            padding: 12px 8px;
            text-align: center;
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: clamp(0.8rem, 1.5vw, 1.2rem);
            color: var(--gold);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .q-cell {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: clamp(1.2rem, 2.5vw, 2rem);
            color: var(--pattern-color);
            cursor: pointer;
            transition: all 0.25s;
            min-height: 60px;
        }

        .q-cell:hover {
            background: rgba(96, 165, 250, 0.12);
            border-color: var(--pattern-color);
            transform: scale(1.03);
        }

        .q-cell.used {
            opacity: 0.2;
            cursor: default;
            pointer-events: none;
        }

        /* Scoreboard sidebar */
        .game-layout {
            flex: 1;
            display: flex;
            gap: 12px;
            min-height: 0;
        }

        .board-wrapper {
            flex: 1;
            min-width: 0;
        }

        .scoreboard-panel {
            width: 220px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
        }

        .scoreboard-title {
            font-family: 'Impact', 'Arial Black', sans-serif;
            color: var(--gold);
            font-size: 1.1rem;
            text-align: center;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .score-team {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            background: var(--surface-2);
            border-radius: 10px;
        }

        .score-team-name {
            flex: 1;
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .score-value {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 1.3rem;
            color: var(--gold);
            min-width: 40px;
            text-align: center;
        }

        .score-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            line-height: 1;
        }

        .score-btn:hover {
            border-color: var(--gold);
            background: rgba(251, 191, 36, 0.1);
        }

        .score-btn.minus:hover {
            border-color: var(--accent);
            background: rgba(225, 29, 72, 0.1);
        }

        /* ══════════════════════════════════
           QUESTION OVERLAY
        ══════════════════════════════════ */
        #question-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11, 15, 20, 0.92);
            z-index: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            backdrop-filter: blur(10px);
        }

        .overlay-category {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: clamp(1.2rem, 3vw, 2rem);
            color: var(--gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
        }

        .overlay-question {
            font-size: clamp(1.8rem, 5vw, 3.5rem);
            font-weight: 700;
            text-align: center;
            max-width: 900px;
            line-height: 1.3;
            margin-bottom: 30px;
        }

        .overlay-answer {
            font-size: clamp(1.5rem, 4vw, 2.8rem);
            color: var(--gold);
            font-weight: 700;
            text-align: center;
            max-width: 800px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
        }

        .overlay-answer.show {
            opacity: 1;
            transform: translateY(0);
        }

        .overlay-timer {
            margin-top: 30px;
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: clamp(2rem, 5vw, 4rem);
            color: var(--pattern-color);
        }

        .overlay-timer.urgent {
            color: var(--accent);
            animation: pulse-timer 0.5s ease-in-out infinite alternate;
        }

        @keyframes pulse-timer {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0.7; transform: scale(1.08); }
        }

        .overlay-buttons {
            display: flex;
            gap: 16px;
            margin-top: 30px;
        }

        .btn-overlay {
            padding: 14px 36px;
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 1.3rem;
            letter-spacing: 1px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-overlay:hover { transform: scale(1.05); }

        .btn-reveal {
            background: var(--gold);
            color: #0b0f14;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
        }

        .btn-close-q {
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border);
        }

        /* ══════════════════════════════════
           ROUND TRANSITION OVERLAY
        ══════════════════════════════════ */
        #round-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11, 15, 20, 0.95);
            z-index: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .round-announce {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: clamp(3rem, 8vw, 6rem);
            color: var(--gold);
            letter-spacing: 4px;
            text-shadow: 0 0 40px rgba(251, 191, 36, 0.4);
            animation: round-pop 0.6s ease-out;
        }

        @keyframes round-pop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .round-sub {
            font-size: 1.3rem;
            color: var(--muted);
            margin-top: 16px;
        }

        .btn-round-go {
            margin-top: 40px;
            padding: 16px 50px;
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 1.5rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(225, 29, 72, 0.5);
            transition: transform 0.2s;
        }

        .btn-round-go:hover { transform: scale(1.05); }

        /* ── Fullscreen ── */
        .btn-fullscreen {
            background: none;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            color: var(--muted);
            font-size: 1rem;
            transition: all 0.2s;
        }
        .btn-fullscreen:hover { border-color: var(--gold); color: var(--text); }

        /* ── Award points overlay ── */
        .award-section {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .award-btn {
            padding: 10px 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s;
            color: var(--text);
        }

        .award-btn:hover {
            border-color: var(--gold);
            background: rgba(251, 191, 36, 0.1);
        }

        .award-btn.awarded {
            border-color: var(--gold);
            background: rgba(251, 191, 36, 0.2);
            color: var(--gold);
        }

        /* ── Game Over ── */
        #gameover-screen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }

        .gameover-title {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: clamp(2.5rem, 7vw, 5rem);
            color: var(--gold);
            text-shadow: 0 0 40px rgba(251, 191, 36, 0.4);
            margin-bottom: 10px;
        }

        .winner-name {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: var(--accent);
            text-shadow: 0 0 30px rgba(225, 29, 72, 0.4);
            margin-bottom: 40px;
        }

        .final-scores {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 300px;
            margin-bottom: 40px;
        }

        .final-score-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 1.2rem;
        }

        .final-score-row.first {
            border-color: var(--gold);
            background: rgba(251, 191, 36, 0.1);
        }

        .final-score-row .fs-name { font-weight: 700; }
        .final-score-row .fs-pts {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 1.5rem;
            color: var(--gold);
        }

        .btn-play-again {
            padding: 16px 50px;
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 1.5rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(225, 29, 72, 0.5);
            transition: transform 0.2s;
        }
        .btn-play-again:hover { transform: scale(1.05); }

        .btn-back-home {
            margin-top: 16px;
            padding: 12px 36px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--muted);
            transition: all 0.2s;
        }
        .btn-back-home:hover { color: var(--text); border-color: var(--gold); }

        /* ── Point amount input ── */
        .point-config {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .point-config label {
            color: var(--muted);
            font-size: 1rem;
        }
    </style>
</head>
<body>

<!-- ═══ BACK LINK ═══ -->
<a href="index.html" class="back-link" id="backLink">&#8592; Volunteer Portal</a>

<!-- ═══════════════════════════════════
     SCREEN 1: SETUP
═══════════════════════════════════ -->
<div id="setup-screen">
    <div class="setup-header">
        <h1>TRIVIA NIGHT</h1>
        <p>Bellwood FOE 1859 Aerie</p>
    </div>

    <!-- Game Settings -->
    <div class="setup-section">
        <h2>Game Settings</h2>
        <div class="setup-row">
            <label>Number of Rounds</label>
            <input type="number" id="numRounds" min="1" max="20" value="3">
        </div>
        <div class="setup-row">
            <label>Categories per Round</label>
            <input type="number" id="numCategories" min="1" max="8" value="4">
        </div>
        <div class="setup-row">
            <label>Questions per Category</label>
            <input type="number" id="numQuestions" min="1" max="10" value="5">
        </div>
        <div class="setup-row">
            <label>Points per Question</label>
            <input type="number" id="pointsPerQ" min="1" max="1000" value="10">
        </div>
        <div class="setup-row">
            <label>Timer</label>
            <div class="toggle-row">
                <button class="toggle" id="timerToggle" onclick="toggleTimer()"></button>
                <span id="timerLabel" style="color:var(--muted)">Off</span>
            </div>
        </div>
        <div class="setup-row hidden" id="timerRow">
            <label>Seconds per Question</label>
            <input type="number" id="timerSeconds" min="5" max="120" value="30">
        </div>
    </div>

    <!-- Teams -->
    <div class="setup-section">
        <h2>Teams</h2>
        <div class="team-list" id="teamList">
            <div class="team-entry">
                <input type="text" placeholder="Team 1 name" maxlength="30">
                <button class="btn-small remove" onclick="removeTeam(this)">&#10005;</button>
            </div>
            <div class="team-entry">
                <input type="text" placeholder="Team 2 name" maxlength="30">
                <button class="btn-small remove" onclick="removeTeam(this)">&#10005;</button>
            </div>
        </div>
        <button class="btn-small btn-add-team" onclick="addTeam()" style="margin-top:12px">+ Add Team</button>
    </div>

    <button class="btn-start-game" onclick="goToQuestions()">ENTER QUESTIONS &#8594;</button>
</div>

<!-- ═══════════════════════════════════
     SCREEN 2: QUESTION ENTRY
═══════════════════════════════════ -->
<div id="question-screen" class="hidden">
    <div class="q-header">
        <h1>ENTER QUESTIONS</h1>
    </div>

    <div class="q-round-tabs" id="roundTabs"></div>
    <div id="categoryBlocks"></div>

    <div class="q-nav-row">
        <button class="btn-nav secondary" onclick="backToSetup()">&#8592; SETUP</button>
        <button class="btn-nav primary" onclick="startGame()">START GAME &#8594;</button>
    </div>
</div>

<!-- ═══════════════════════════════════
     SCREEN 3: GAME BOARD
═══════════════════════════════════ -->
<div id="game-screen" class="hidden">
    <div class="game-top-bar">
        <div class="game-title">TRIVIA NIGHT</div>
        <div class="round-indicator" id="roundIndicator">ROUND 1</div>
        <div class="game-controls">
            <button class="btn-game" id="btnScoreboard" onclick="toggleScoreboard()">Scoreboard</button>
            <button class="btn-fullscreen" onclick="toggleFullscreen()" title="Fullscreen">&#x26F6;</button>
        </div>
    </div>

    <div class="game-layout">
        <div class="board-wrapper">
            <div class="category-grid" id="gameBoard"></div>
        </div>
        <div class="scoreboard-panel" id="scoreboardPanel" style="display:none;">
            <div class="scoreboard-title">SCORES</div>
            <div id="scoreList"></div>
        </div>
    </div>
</div>

<!-- ═══ QUESTION OVERLAY ═══ -->
<div id="question-overlay" class="hidden">
    <div class="overlay-category" id="olCategory"></div>
    <div class="overlay-question" id="olQuestion"></div>
    <div class="overlay-answer" id="olAnswer"></div>
    <div class="overlay-timer hidden" id="olTimer"></div>
    <div class="award-section hidden" id="awardSection"></div>
    <div class="overlay-buttons">
        <button class="btn-overlay btn-reveal" id="btnReveal" onclick="revealAnswer()">REVEAL ANSWER</button>
        <button class="btn-overlay btn-close-q" onclick="closeQuestion()">CLOSE</button>
    </div>
</div>

<!-- ═══ ROUND TRANSITION ═══ -->
<div id="round-overlay" class="hidden">
    <div class="round-announce" id="roundAnnounce"></div>
    <div class="round-sub" id="roundSub"></div>
    <button class="btn-round-go" onclick="dismissRound()">LET'S GO!</button>
</div>

<!-- ═══ GAME OVER ═══ -->
<div id="gameover-screen" class="hidden">
    <div class="gameover-title">GAME OVER!</div>
    <div class="winner-name" id="winnerName"></div>
    <div class="final-scores" id="finalScores"></div>
    <button class="btn-play-again" onclick="playAgain()">PLAY AGAIN</button>
    <button class="btn-back-home" onclick="location.href='index.html'">Back to Portal</button>
</div>

<script>
/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
let config = {
    rounds: 3,
    categoriesPerRound: 4,
    questionsPerCategory: 5,
    pointsPerQuestion: 10,
    timerEnabled: false,
    timerSeconds: 30
};

let teams = [];          // [{name, score}]
let gameData = [];       // [round][category]{name, questions:[{q,a,used}]}
let currentRound = 0;
let questionsAnswered = 0;
let totalQuestionsInRound = 0;
let timerInterval = null;
let currentTimerValue = 0;
let editingRound = 0;
let scoreboardVisible = false;

/* ═══════════════════════════════════════════
   SETUP SCREEN
═══════════════════════════════════════════ */
function toggleTimer() {
    const btn = document.getElementById('timerToggle');
    const row = document.getElementById('timerRow');
    const lbl = document.getElementById('timerLabel');
    btn.classList.toggle('on');
    const on = btn.classList.contains('on');
    row.classList.toggle('hidden', !on);
    lbl.textContent = on ? 'On' : 'Off';
}

function addTeam() {
    const list = document.getElementById('teamList');
    const count = list.children.length + 1;
    const div = document.createElement('div');
    div.className = 'team-entry';
    div.innerHTML = `<input type="text" placeholder="Team ${count} name" maxlength="30">
        <button class="btn-small remove" onclick="removeTeam(this)">&#10005;</button>`;
    list.appendChild(div);
}

function removeTeam(btn) {
    const list = document.getElementById('teamList');
    if (list.children.length <= 1) return;
    btn.parentElement.remove();
}

/* ═══════════════════════════════════════════
   QUESTION ENTRY SCREEN
═══════════════════════════════════════════ */
function goToQuestions() {
    // Read config
    config.rounds = clampInt('numRounds', 1, 20);
    config.categoriesPerRound = clampInt('numCategories', 1, 8);
    config.questionsPerCategory = clampInt('numQuestions', 1, 10);
    config.pointsPerQuestion = clampInt('pointsPerQ', 1, 1000);
    config.timerEnabled = document.getElementById('timerToggle').classList.contains('on');
    config.timerSeconds = clampInt('timerSeconds', 5, 120);

    // Read teams
    const inputs = document.querySelectorAll('#teamList .team-entry input');
    teams = [];
    inputs.forEach((inp, i) => {
        const name = inp.value.trim() || `Team ${i + 1}`;
        teams.push({ name, score: 0 });
    });
    if (teams.length === 0) teams.push({ name: 'Team 1', score: 0 });

    // Init gameData if empty or config changed
    initGameData();

    // Build question entry UI
    buildQuestionUI();

    show('question-screen');
    hide('setup-screen');
}

function initGameData() {
    // Preserve existing data where possible
    const old = gameData;
    gameData = [];
    for (let r = 0; r < config.rounds; r++) {
        const cats = [];
        for (let c = 0; c < config.categoriesPerRound; c++) {
            const oldCat = old[r] && old[r][c] ? old[r][c] : null;
            const questions = [];
            for (let q = 0; q < config.questionsPerCategory; q++) {
                const oldQ = oldCat && oldCat.questions[q] ? oldCat.questions[q] : null;
                questions.push({
                    q: oldQ ? oldQ.q : '',
                    a: oldQ ? oldQ.a : '',
                    used: false
                });
            }
            cats.push({
                name: oldCat ? oldCat.name : '',
                questions
            });
        }
        gameData.push(cats);
    }
}

function buildQuestionUI() {
    // Round tabs
    const tabs = document.getElementById('roundTabs');
    tabs.innerHTML = '';
    for (let r = 0; r < config.rounds; r++) {
        const btn = document.createElement('button');
        btn.className = 'round-tab' + (r === editingRound ? ' active' : '');
        btn.textContent = `Round ${r + 1}`;
        btn.onclick = () => switchEditRound(r);
        tabs.appendChild(btn);
    }

    renderCategoryBlocks();
}

function switchEditRound(r) {
    saveCurrentQuestions();
    editingRound = r;
    document.querySelectorAll('.round-tab').forEach((t, i) => {
        t.classList.toggle('active', i === r);
    });
    renderCategoryBlocks();
}

function renderCategoryBlocks() {
    const container = document.getElementById('categoryBlocks');
    container.innerHTML = '';
    const round = gameData[editingRound];

    for (let c = 0; c < round.length; c++) {
        const cat = round[c];
        const block = document.createElement('div');
        block.className = 'category-block';

        let qRows = '';
        for (let q = 0; q < cat.questions.length; q++) {
            qRows += `
                <div class="question-row">
                    <div class="q-num">${q + 1}.</div>
                    <input type="text" placeholder="Question" class="q-input" data-cat="${c}" data-q="${q}" value="${escHtml(cat.questions[q].q)}">
                    <input type="text" placeholder="Answer" class="answer-input" data-cat="${c}" data-q="${q}" value="${escHtml(cat.questions[q].a)}">
                </div>`;
        }

        block.innerHTML = `
            <h3><input type="text" placeholder="Category ${c + 1} Name" class="cat-name-input" data-cat="${c}" value="${escHtml(cat.name)}"></h3>
            ${qRows}`;
        container.appendChild(block);
    }
}

function saveCurrentQuestions() {
    const round = gameData[editingRound];
    if (!round) return;

    document.querySelectorAll('.cat-name-input').forEach(inp => {
        const c = +inp.dataset.cat;
        if (round[c]) round[c].name = inp.value.trim();
    });

    document.querySelectorAll('.q-input').forEach(inp => {
        const c = +inp.dataset.cat;
        const q = +inp.dataset.q;
        if (round[c] && round[c].questions[q]) round[c].questions[q].q = inp.value.trim();
    });

    document.querySelectorAll('.answer-input').forEach(inp => {
        const c = +inp.dataset.cat;
        const q = +inp.dataset.q;
        if (round[c] && round[c].questions[q]) round[c].questions[q].a = inp.value.trim();
    });
}

function backToSetup() {
    saveCurrentQuestions();
    show('setup-screen');
    hide('question-screen');
}

/* ═══════════════════════════════════════════
   GAME SCREEN
═══════════════════════════════════════════ */
function startGame() {
    saveCurrentQuestions();
    currentRound = 0;
    questionsAnswered = 0;
    teams.forEach(t => t.score = 0);

    hide('setup-screen');
    hide('question-screen');
    document.getElementById('backLink').classList.add('hidden');

    showRoundTransition();
}

function showRoundTransition() {
    document.getElementById('roundAnnounce').textContent = `ROUND ${currentRound + 1}`;

    // Show category names for this round
    const catNames = gameData[currentRound]
        .map(c => c.name || 'Unnamed')
        .join('  |  ');
    document.getElementById('roundSub').textContent = catNames;

    show('round-overlay');
}

function dismissRound() {
    hide('round-overlay');
    show('game-screen');
    buildGameBoard();
    updateRoundIndicator();
    buildScoreboard();
    questionsAnswered = 0;
    totalQuestionsInRound = gameData[currentRound].reduce((sum, cat) => sum + cat.questions.length, 0);
}

function buildGameBoard() {
    const board = document.getElementById('gameBoard');
    const round = gameData[currentRound];
    const numCats = round.length;

    board.style.gridTemplateColumns = `repeat(${numCats}, 1fr)`;
    board.innerHTML = '';

    for (let c = 0; c < numCats; c++) {
        const col = document.createElement('div');
        col.className = 'cat-column';

        const header = document.createElement('div');
        header.className = 'cat-header';
        header.textContent = round[c].name || `Category ${c + 1}`;
        col.appendChild(header);

        for (let q = 0; q < round[c].questions.length; q++) {
            const cell = document.createElement('div');
            cell.className = 'q-cell' + (round[c].questions[q].used ? ' used' : '');
            cell.textContent = config.pointsPerQuestion * (q + 1);
            cell.onclick = () => openQuestion(c, q);
            cell.id = `cell-${c}-${q}`;
            col.appendChild(cell);
        }

        board.appendChild(col);
    }
}

function updateRoundIndicator() {
    document.getElementById('roundIndicator').textContent = `ROUND ${currentRound + 1} of ${config.rounds}`;
}

/* ── Scoreboard ── */
function buildScoreboard() {
    const list = document.getElementById('scoreList');
    list.innerHTML = '';
    const sorted = [...teams].sort((a, b) => b.score - a.score);
    sorted.forEach((team, i) => {
        const idx = teams.indexOf(team);
        const row = document.createElement('div');
        row.className = 'score-team';
        row.innerHTML = `
            <button class="score-btn minus" onclick="adjustScore(${idx}, -${config.pointsPerQuestion})">-</button>
            <span class="score-team-name">${escHtml(team.name)}</span>
            <span class="score-value" id="score-${idx}">${team.score}</span>
            <button class="score-btn" onclick="adjustScore(${idx}, ${config.pointsPerQuestion})">+</button>`;
        list.appendChild(row);
    });
}

function adjustScore(teamIdx, amount) {
    teams[teamIdx].score += amount;
    buildScoreboard();
}

function toggleScoreboard() {
    scoreboardVisible = !scoreboardVisible;
    const panel = document.getElementById('scoreboardPanel');
    const btn = document.getElementById('btnScoreboard');
    panel.style.display = scoreboardVisible ? 'flex' : 'none';
    btn.classList.toggle('active-btn', scoreboardVisible);
    if (scoreboardVisible) buildScoreboard();
}

/* ── Question Overlay ── */
function openQuestion(catIdx, qIdx) {
    const round = gameData[currentRound];
    const cat = round[catIdx];
    const question = cat.questions[qIdx];
    if (question.used) return;

    document.getElementById('olCategory').textContent = cat.name || `Category ${catIdx + 1}`;
    document.getElementById('olQuestion').textContent = question.q || '(No question entered)';
    document.getElementById('olAnswer').textContent = question.a || '(No answer entered)';
    document.getElementById('olAnswer').classList.remove('show');
    document.getElementById('btnReveal').classList.remove('hidden');

    // Store current
    document.getElementById('question-overlay').dataset.cat = catIdx;
    document.getElementById('question-overlay').dataset.q = qIdx;

    // Award section
    const awardDiv = document.getElementById('awardSection');
    awardDiv.classList.add('hidden');
    awardDiv.innerHTML = '';

    // Timer
    const timerEl = document.getElementById('olTimer');
    if (config.timerEnabled) {
        timerEl.classList.remove('hidden');
        currentTimerValue = config.timerSeconds;
        timerEl.textContent = currentTimerValue;
        timerEl.classList.remove('urgent');
        startTimer();
    } else {
        timerEl.classList.add('hidden');
    }

    show('question-overlay');
}

function startTimer() {
    clearInterval(timerInterval);
    const timerEl = document.getElementById('olTimer');
    timerInterval = setInterval(() => {
        currentTimerValue--;
        timerEl.textContent = currentTimerValue;
        if (currentTimerValue <= 5) timerEl.classList.add('urgent');
        if (currentTimerValue <= 0) {
            clearInterval(timerInterval);
            timerEl.textContent = "TIME'S UP!";
        }
    }, 1000);
}

function revealAnswer() {
    clearInterval(timerInterval);
    document.getElementById('olAnswer').classList.add('show');
    document.getElementById('btnReveal').classList.add('hidden');

    // Show award buttons
    const awardDiv = document.getElementById('awardSection');
    awardDiv.classList.remove('hidden');
    awardDiv.innerHTML = '';

    const catIdx = +document.getElementById('question-overlay').dataset.cat;
    const qIdx = +document.getElementById('question-overlay').dataset.q;
    const points = config.pointsPerQuestion * (qIdx + 1);

    teams.forEach((team, i) => {
        const btn = document.createElement('button');
        btn.className = 'award-btn';
        btn.textContent = `${team.name} (+${points})`;
        btn.onclick = () => {
            if (btn.classList.contains('awarded')) {
                btn.classList.remove('awarded');
                teams[i].score -= points;
            } else {
                btn.classList.add('awarded');
                teams[i].score += points;
            }
            buildScoreboard();
        };
        awardDiv.appendChild(btn);
    });
}

function closeQuestion() {
    clearInterval(timerInterval);
    const catIdx = +document.getElementById('question-overlay').dataset.cat;
    const qIdx = +document.getElementById('question-overlay').dataset.q;

    // Mark used
    gameData[currentRound][catIdx].questions[qIdx].used = true;
    const cell = document.getElementById(`cell-${catIdx}-${qIdx}`);
    if (cell) cell.classList.add('used');

    hide('question-overlay');
    questionsAnswered++;

    // Check if round is done
    if (questionsAnswered >= totalQuestionsInRound) {
        if (currentRound < config.rounds - 1) {
            currentRound++;
            setTimeout(showRoundTransition, 500);
        } else {
            setTimeout(showGameOver, 500);
        }
    }
}

/* ── Game Over ── */
function showGameOver() {
    hide('game-screen');

    const sorted = [...teams].sort((a, b) => b.score - a.score);
    document.getElementById('winnerName').textContent =
        sorted[0].score > 0 ? `${sorted[0].name} Wins!` : '';

    const container = document.getElementById('finalScores');
    container.innerHTML = '';
    sorted.forEach((team, i) => {
        const row = document.createElement('div');
        row.className = 'final-score-row' + (i === 0 ? ' first' : '');
        row.innerHTML = `<span class="fs-name">${escHtml(team.name)}</span><span class="fs-pts">${team.score}</span>`;
        container.appendChild(row);
    });

    show('gameover-screen');
}

function playAgain() {
    hide('gameover-screen');
    document.getElementById('backLink').classList.remove('hidden');
    // Reset used flags
    gameData.forEach(round => round.forEach(cat => cat.questions.forEach(q => q.used = false)));
    teams.forEach(t => t.score = 0);
    show('setup-screen');
}

/* ── Fullscreen ── */
function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        document.exitFullscreen();
    }
}

/* ── Keyboard ── */
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
        if (!document.getElementById('question-overlay').classList.contains('hidden')) {
            closeQuestion();
        }
    }
    if (e.key === ' ' || e.key === 'Enter') {
        if (!document.getElementById('question-overlay').classList.contains('hidden')) {
            const answerEl = document.getElementById('olAnswer');
            if (!answerEl.classList.contains('show')) {
                e.preventDefault();
                revealAnswer();
            }
        }
    }
});

/* ═══════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════ */
function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }

function clampInt(id, min, max) {
    let v = parseInt(document.getElementById(id).value) || min;
    return Math.max(min, Math.min(max, v));
}

function escHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
}
</script>
</body>
</html>
