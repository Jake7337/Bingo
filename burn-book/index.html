<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>burn book</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Permanent+Marker&family=Staatliches&display=swap" rel="stylesheet" />
<style>
  :root{
    --pink:#ff2f7e;
    --pink-soft:#ff5c9a;
    --pink-dim:rgba(255,47,126,.28);
    --leather:#17110f;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    background:#0a0807;
    color:#f3e9ea;
    font-family:'Caveat','Segoe Print','Comic Sans MS',cursive;
    overflow:hidden;
    position:relative;
  }

  /* ambient firelight — always faint, pulses while burning */
  .glow{
    position:fixed; inset:0; pointer-events:none; z-index:5;
    background:
      radial-gradient(120% 80% at 100% 60%, rgba(255,110,30,.16), transparent 55%),
      radial-gradient(120% 90% at 50% 100%, rgba(255,90,20,.10), transparent 70%);
    mix-blend-mode:screen;
    transition:opacity .4s ease;
  }
  body.burning .glow{ opacity:1; animation:flicker .18s infinite alternate; filter:brightness(1.8); }
  @keyframes flicker{ from{ opacity:.75 } to{ opacity:1 } }

  /* ---------- cover screen ---------- */
  .cover{
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:20px; padding:24px;
    cursor:pointer;
    background:radial-gradient(60% 60% at 50% 45%, #14100e, #0a0807 80%);
  }
  .cover, .cover *{
    cursor:pointer;
    user-select:none; -webkit-user-select:none;
    -webkit-touch-callout:none;
  }
  .cover img{
    max-height:80vh; max-width:88vw;
    object-fit:contain;
    border-radius:8px;
    filter:drop-shadow(0 30px 60px rgba(0,0,0,.6)) drop-shadow(0 0 40px rgba(255,80,30,.15));
    animation:float 4.5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes float{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-12px) } }
  .open-hint{
    margin:0;
    font-family:'Staatliches','Caveat',sans-serif;
    letter-spacing:4px;
    font-size:16px;
    color:var(--pink-soft);
    text-transform:uppercase;
    animation:breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe{ 0%,100%{ opacity:.35 } 50%{ opacity:.9 } }
  .cover.closing{ animation:openBook .85s ease-in forwards; pointer-events:none; }
  @keyframes openBook{
    to{ transform:scale(1.18); opacity:0; filter:blur(6px) brightness(1.6); }
  }

  /* ---------- writing screen ---------- */
  .writer{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px;
    padding:20px 16px calc(20px + env(safe-area-inset-bottom));
    opacity:0;
  }
  .writer.show{ animation:fadeUp .7s ease forwards; }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(14px) } to{ opacity:1; transform:none } }

  .wordmark{
    font-family:'Permanent Marker','Caveat',cursive;
    font-size:26px;
    color:var(--pink);
    transform:rotate(-2deg);
    text-shadow:0 0 18px rgba(255,47,126,.5);
    letter-spacing:.5px;
  }

  .stage{
    position:relative;
    width:min(92vw, 620px);
    height:min(60vh, 720px);
  }
  .page{
    position:absolute; inset:0;
    border-radius:6px;
    background:
      radial-gradient(circle at 28% 16%, rgba(255,255,255,.035), transparent 45%),
      repeating-linear-gradient(180deg, transparent 0 33px, rgba(255,47,126,.10) 33px 34px),
      linear-gradient(90deg, transparent 55px, rgba(255,47,126,.34) 55px, rgba(255,47,126,.34) 57px, transparent 57px),
      linear-gradient(135deg, #1c1411, #120c0a);
    background-position:0 0, 0 40px, 0 0, 0 0;
    box-shadow:
      0 26px 60px rgba(0,0,0,.6),
      inset 0 0 0 6px rgba(0,0,0,.45),
      inset 0 0 0 7px rgba(255,47,126,.16);
    transform-origin:50% 65%;
  }
  .page textarea{
    position:absolute; inset:0;
    width:100%; height:100%;
    border:0; outline:0; resize:none;
    background:transparent;
    color:var(--pink);
    font:inherit;
    font-size:22px;
    line-height:34px;
    padding:40px 34px 34px 68px;
    caret-color:var(--pink);
    text-shadow:0 0 10px rgba(255,47,126,.35);
  }
  .page textarea::placeholder{ color:rgba(255,47,126,.32); text-shadow:none; }

  .burn-canvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    border-radius:6px;
    pointer-events:none;
    transform-origin:50% 65%;
  }

  .burn-btn{
    position:relative; z-index:2;
    border:0;
    padding:13px 30px;
    font-family:'Staatliches','Caveat',sans-serif;
    font-size:19px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#ffe1ec;
    background:#1c1210;
    border-radius:999px;
    overflow:hidden;
    cursor:pointer;
    user-select:none;
    touch-action:none;
    box-shadow:0 6px 18px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,47,126,.45);
  }
  .burn-btn .label{ position:relative; z-index:2; }
  .burn-btn .fill{
    position:absolute; left:0; top:0; bottom:0; width:100%;
    transform:scaleX(0); transform-origin:left;
    background:linear-gradient(90deg,#ff2f7e,#ff7a18,#ffcf3f);
    z-index:1;
  }
  .burn-btn.arming .fill{ transform:scaleX(1); }
  .burn-btn:disabled{ opacity:.4; cursor:default; }

  .hint{
    font-family:'Staatliches','Caveat',sans-serif;
    letter-spacing:3px;
    font-size:14px;
    text-transform:uppercase;
    color:var(--pink-soft);
    opacity:.5;
    min-height:18px;
    text-align:center;
  }

  @media (max-width:480px){
    .wordmark{ font-size:23px; }
    .stage{ height:min(58vh, 560px); }
  }
</style>
</head>

    <p class="open-hint">tap to open</p>
  </section>

  <main id="writer" class="writer" hidden>
    <div class="wordmark">burn book</div>
    <div class="stage">
      <div class="page" id="page">
        <textarea id="entry" placeholder="Say whatever you need to say. No one sees this. Nothing is saved." autocomplete="off" autocapitalize="sentences" spellcheck="true"></textarea>
      </div>
    </div>
    <button class="burn-btn" id="burnBtn" aria-label="Hold to burn">
      <span class="fill"></span>
      <span class="label">hold to burn</span>
    </button>
    <div class="hint" id="hint">write it. burn it. let it go.</div>
  </main>

<script>
(() => {
  const TAGLINE   = 'write it. burn it. let it go.';
  const HOLD_MS   = 850;
  const RISE_MS   = 3000;
  const TAIL_MS   = 1200;
  const STEP      = 3;

  /* ---------- cover -> writer ---------- */
  const cover  = document.getElementById('cover');
  const writer = document.getElementById('writer');
  const entry  = document.getElementById('entry');

  let opened = false;
  function openBook(){
    if (opened) return;
    opened = true;
    cover.classList.add('closing');
    setTimeout(() => {
      cover.hidden = true;
      document.body.classList.remove('cover-mode');
      writer.hidden = false;
      writer.classList.add('show');
      setTimeout(() => entry.focus(), 250);
    }, 820);
  }
  // iOS Safari doesn't reliably fire "click" on non-button elements — listen broadly
  ['click', 'touchend', 'pointerup'].forEach(ev =>
    cover.addEventListener(ev, e => { e.preventDefault(); openBook(); }, { passive: false })
  );
  cover.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openBook(); }
  });

  /* ---------- hold to burn ---------- */
  const btn  = document.getElementById('burnBtn');
  const hint = document.getElementById('hint');
  let busy = false, armed = false, holdTimer = null, hintTimer = null;

  function startHold(e){
    if (busy) return;
    if (!entry.value.trim()){ flashHint('write something first'); return; }
    e.preventDefault();
    armed = true;
    btn.classList.add('arming');
    btn.querySelector('.fill').style.transition = `transform ${HOLD_MS}ms linear`;
    holdTimer = setTimeout(() => { if (armed) burn(); }, HOLD_MS);
  }
  function cancelHold(){
    armed = false;
    clearTimeout(holdTimer);
    btn.classList.remove('arming');
    const f = btn.querySelector('.fill');
    f.style.transition = 'transform .18s ease';
    f.style.transform = '';
  }
  btn.addEventListener('pointerdown', startHold);
  btn.addEventListener('pointerup', cancelHold);
  btn.addEventListener('pointerleave', cancelHold);
  btn.addEventListener('pointercancel', cancelHold);

  function flashHint(msg){
    hint.textContent = msg;
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => hint.textContent = TAGLINE, 1800);
  }

  /* ---------- render the page (with text) to an offscreen canvas ---------- */
  function renderPage(wCss, hCss, dpr){
    const c = document.createElement('canvas');
    c.width = wCss * dpr; c.height = hCss * dpr;
    const x = c.getContext('2d');
    x.scale(dpr, dpr);

    x.fillStyle = '#17110f';
    x.fillRect(0, 0, wCss, hCss);

    x.strokeStyle = 'rgba(255,47,126,.12)';
    x.lineWidth = 1;
    for (let y = 40 + 33.5; y < hCss; y += 34){
      x.beginPath(); x.moveTo(0, y); x.lineTo(wCss, y); x.stroke();
    }
    x.strokeStyle = 'rgba(255,47,126,.34)';
    x.lineWidth = 2;
    x.beginPath(); x.moveTo(56, 0); x.lineTo(56, hCss); x.stroke();

    const cs = getComputedStyle(entry);
    x.fillStyle = '#ff2f7e';
    x.textBaseline = 'alphabetic';
    x.font = `${cs.fontWeight} 22px ${cs.fontFamily}`;
    const padL = 68, padR = 34, padT = 40, lh = 34;
    const maxW = wCss - padL - padR;
    let y = padT + 24 - entry.scrollTop;

    entry.value.split('\n').forEach(para => {
      const words = para.split(' ');
      let line = '';
      for (let i = 0; i < words.length; i++){
        const test = line ? line + ' ' + words[i] : words[i];
        if (x.measureText(test).width > maxW && line){
          if (y > -lh && y < hCss + lh) x.fillText(line, padL, y);
          line = words[i];
          y += lh;
        } else {
          line = test;
        }
      }
      if (y > -lh && y < hCss + lh) x.fillText(line, padL, y);
      y += lh;
    });

    return c;
  }

  /* ---------- the burn ---------- */
  function burn(){
    busy = true; armed = false;
    btn.disabled = true;
    btn.classList.remove('arming');
    entry.blur();
    entry.readOnly = true;
    document.body.classList.add('burning');

    function finishNow(){
      entry.value = '';
      entry.readOnly = false;
      entry.style.visibility = '';
      document.body.classList.remove('burning');
      btn.disabled = false;
      const f = btn.querySelector('.fill');
      f.style.transition = 'transform .18s ease';
      f.style.transform = '';
      busy = false;
      flashHint('gone.');
      entry.focus();
    }

    const rect = document.getElementById('page').getBoundingClientRect();
    const wCss = rect.width, hCss = rect.height;
    const dpr  = Math.min(window.devicePixelRatio || 1, 2);
    if (wCss < 20 || hCss < 20){ finishNow(); return; }

    const paper = renderPage(wCss, hCss, dpr);

    const canvas = document.createElement('canvas');
    canvas.className = 'burn-canvas';
    canvas.width = wCss * dpr; canvas.height = hCss * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    entry.style.visibility = 'hidden';
    document.getElementById('page').appendChild(canvas);

    const cols  = Math.ceil(wCss / STEP) + 1;
    const front = new Float32Array(cols);
    const seed  = new Float32Array(cols);
    for (let i = 0; i < cols; i++) seed[i] = Math.random();
    const spots = [0.15, 0.5, 0.85].map(f => f * cols + (Math.random()*40-20));

    const embers = [], smoke = [];
    let start = performance.now(), last = start;

    function noise(i, t){
      return (
        Math.sin(i*0.06 + t*0.004) * 0.5 +
        Math.sin(i*0.017 - t*0.0022 + seed[i]*6) * 0.32 +
        (seed[i] - 0.5) * 0.9
      );
    }

    function frame(now){
     try {
      let dt = Math.min(now - last, 34); last = now;
      const elapsed = now - start;
      const p = Math.min(elapsed / RISE_MS, 1);
      const baseSpeed = hCss / RISE_MS;

      let maxFront = 0, minFront = Infinity;
      for (let i = 0; i < cols; i++){
        let ignite = 1;
        if (elapsed < 550){
          let d = Math.min(...spots.map(s => Math.abs(s - i)));
          ignite = Math.max(0.05, 1 - d / 60) * (elapsed / 550) + 0.02;
        }
        const n = noise(i, elapsed);
        front[i] += baseSpeed * dt * ignite * (0.45 + 1.2 * (n * 0.5 + 0.5));
        if (front[i] > maxFront) maxFront = front[i];
        if (front[i] < minFront) minFront = front[i];
      }
      for (let i = 1; i < cols - 1; i++){
        front[i] = front[i] * 0.8 + (front[i-1] + front[i+1]) * 0.1;
      }

      const spawn = Math.min(dt * 0.6, 18);
      for (let k = 0; k < spawn; k++){
        const i = (Math.random() * cols) | 0;
        const fx = i * STEP;
        const fy = hCss - front[i];
        if (fy <= 2 || fy >= hCss) continue;
        embers.push({
          x: fx, y: fy,
          vx: (Math.random()-0.5) * 50,
          vy: -60 - Math.random()*170,
          life: 1, decay: 0.55 + Math.random()*0.8,
          r: 1 + Math.random()*2.4
        });
        if (Math.random() < 0.12){
          smoke.push({
            x: fx + (Math.random()-0.5)*30, y: fy,
            vx: (Math.random()-0.5)*18, vy: -25 - Math.random()*45,
            life: 1, decay: 0.35 + Math.random()*0.3,
            r: 6 + Math.random()*10, g: 40 + (Math.random()*40|0)
          });
        }
      }

      ctx.clearRect(0, 0, wCss, hCss);

      const lift = p * 46;
      const tilt = Math.sin(elapsed * 0.006) * 2 * p;
      canvas.style.transform = `translateY(${-lift}px) rotate(${tilt}deg) scale(${1 - p*0.05})`;
      canvas.style.filter = `brightness(${1 + p*0.35}) contrast(${1 + p*0.15})`;

      ctx.drawImage(paper, 0, 0, wCss, hCss);

      const pts = new Array(cols);
      for (let i = 0; i < cols; i++) pts[i] = [i * STEP, hCss - front[i]];
      const tracePath = () => {
        ctx.beginPath();
        for (let i = 0; i < cols; i++) (i ? ctx.lineTo(pts[i][0], pts[i][1]) : ctx.moveTo(pts[0][0], pts[0][1]));
      };
      const burnedRegion = () => {
        ctx.beginPath();
        ctx.moveTo(-6, hCss + 6);
        for (let i = 0; i < cols; i++) ctx.lineTo(pts[i][0], pts[i][1]);
        ctx.lineTo(wCss + 6, hCss + 6);
        ctx.closePath();
      };

      ctx.save();
      ctx.globalCompositeOperation = 'destination-out';
      burnedRegion(); ctx.fill();
      ctx.restore();

      ctx.save();
      burnedRegion(); ctx.clip();
      const gy0 = hCss - maxFront - 8;
      const gy1 = hCss - minFront + 60;
      const ash = ctx.createLinearGradient(0, gy0, 0, gy1);
      ash.addColorStop(0,   'rgba(11,7,5,.92)');
      ash.addColorStop(0.4, 'rgba(11,7,5,.42)');
      ash.addColorStop(1,   'rgba(11,7,5,0)');
      ctx.fillStyle = ash;
      ctx.fillRect(0, gy0 - 30, wCss, gy1 - gy0 + 60);
      ctx.restore();

      ctx.save();
      ctx.lineJoin = ctx.lineCap = 'round';
      ctx.filter = 'blur(3px)';
      ctx.strokeStyle = 'rgba(10,6,4,.95)';
      ctx.lineWidth = 20;
      tracePath(); ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const flameGap = Math.max(1, Math.round(16 / STEP));
      for (let i = 0; i < cols; i += flameGap){
        const [x, y] = pts[i];
        if (y <= 0 || y >= hCss) continue;
        const flick = Math.abs(Math.sin(i * 0.6 + elapsed * 0.014 + seed[i] * 9));
        const h = 30 + 55 * flick;
        const sway = Math.sin(elapsed * 0.022 + i * 0.8) * 9;
        const fg = ctx.createLinearGradient(0, y + 4, 0, y - h);
        fg.addColorStop(0,    'rgba(255,120,25,.7)');
        fg.addColorStop(0.35, 'rgba(255,90,15,.4)');
        fg.addColorStop(0.75, 'rgba(255,180,60,.16)');
        fg.addColorStop(1,    'rgba(255,230,150,0)');
        ctx.fillStyle = fg;
        ctx.beginPath();
        ctx.moveTo(x - 10, y + 4);
        ctx.quadraticCurveTo(x - 6 + sway, y - h * 0.55, x + sway, y - h);
        ctx.quadraticCurveTo(x + 6 + sway, y - h * 0.55, x + 10, y + 4);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineJoin = ctx.lineCap = 'round';
      ctx.filter = 'blur(2.5px)';
      ctx.strokeStyle = 'rgba(255,80,15,.55)';
      ctx.lineWidth = 15;
      tracePath(); ctx.stroke();
      ctx.filter = 'blur(0.5px)';
      ctx.strokeStyle = 'rgba(255,160,55,.9)';
      ctx.lineWidth = 3.5;
      tracePath(); ctx.stroke();
      ctx.filter = 'none';
      ctx.strokeStyle = 'rgba(255,235,180,.85)';
      ctx.lineWidth = 1.3;
      tracePath(); ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let e = embers.length - 1; e >= 0; e--){
        const em = embers[e];
        em.life -= em.decay * dt / 1000;
        if (em.life <= 0){ embers.splice(e, 1); continue; }
        em.vy += 12 * dt / 1000;
        em.x += em.vx * dt / 1000;
        em.y += em.vy * dt / 1000;
        const a = Math.max(0, em.life) * (0.55 + Math.random()*0.45);
        ctx.fillStyle = `rgba(255,${60 + (em.life*160|0)},${20 + (em.life*40|0)},${a})`;
        ctx.beginPath();
        ctx.arc(em.x, em.y, em.r * (0.5 + em.life*0.8), 0, 7);
        ctx.fill();
      }
      ctx.restore();

      for (let s = smoke.length - 1; s >= 0; s--){
        const sm = smoke[s];
        sm.life -= sm.decay * dt / 1000;
        if (sm.life <= 0){ smoke.splice(s, 1); continue; }
        sm.x += sm.vx * dt / 1000;
        sm.y += sm.vy * dt / 1000;
        sm.r += 14 * dt / 1000;
        const a = sm.life * 0.16;
        ctx.fillStyle = `rgba(${sm.g},${sm.g},${sm.g},${a})`;
        ctx.beginPath();
        ctx.arc(sm.x, sm.y, sm.r, 0, 7);
        ctx.fill();
      }

      const done = maxFront >= hCss + 20;
      if (done){
        const k = (elapsed - RISE_MS) / TAIL_MS;
        canvas.style.opacity = String(Math.max(0, 1 - k));
        if (k >= 1){ canvas.remove(); finishNow(); return; }
      }
      requestAnimationFrame(frame);
     } catch (err){
      console.error('burn frame error:', err);
      canvas.remove(); finishNow();
     }
    }

    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve())
      .then(() => { start = performance.now(); last = start; requestAnimationFrame(frame); });
  }
})();
</script>
